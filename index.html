<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>findmeIRL</title>
  <meta name="description" content="Privacy-first nearby discovery. Sign in with Google from the findmeIRL app." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1b2e;
      --card: #1a2740;
      --text: #e8eef5;
      --muted: #9aa8bc;
      --accent: #5e9ed6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      max-width: 28rem;
      background: var(--card);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { margin: 0 0 1rem; color: var(--muted); line-height: 1.5; }
    a { color: var(--accent); }
    .links { display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; margin-top: 1.25rem; }
  </style>
</head>
<body>
  <main>
    <h1>findmeIRL</h1>
    <p>
      Nearby people and places, with location privacy built in.
      <strong>Google sign-in</strong> happens in the mobile app &mdash; install findmeIRL and sign in from there.
    </p>
    <p class="links">
      <!-- Add your real store URLs when ready -->
      <!-- <a href="https://apps.apple.com/...">App Store</a> -->
      <!-- <a href="https://play.google.com/...">Google Play</a> -->
      <a href="/privacy.html">Privacy</a>
    </p>
  </main>
</body>
</html>
